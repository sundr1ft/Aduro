name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run compile
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --audit-level=moderate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  smoke:
    runs-on: ubuntu-latest
    needs: [check, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Pack
        run: mkdir -p /tmp/pkg && npm pack --pack-destination /tmp/pkg

      - name: Install from tarball
        run: |
          mkdir -p /tmp/smoke
          cd /tmp/smoke
          npm init -y
          npm install /tmp/pkg/*.tgz

      - name: CLI responds to --help
        run: /tmp/smoke/node_modules/.bin/aduro --help

      - name: Build example site
        run: /tmp/smoke/node_modules/.bin/aduro build ${{ github.workspace }}/example /tmp/smoke-out

      - name: Verify output
        run: |
          test -f /tmp/smoke-out/index.html
          test -f /tmp/smoke-out/posts/hello-world/index.html
          test -f /tmp/smoke-out/posts/no-date-post/index.html
          test -f /tmp/smoke-out/style.css
          ! test -f /tmp/smoke-out/posts/draft-post/index.html
